    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- follows the app's own theme (App sets it) -->
    <meta name="theme-color" content="#0d0d0b" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Home-screen app on iOS: full screen, dark status bar over the app, its own name and icon -->

    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Fonts are self-hosted (public/fonts, OFL; latin subset, one variable file per family) so they
         work offline and don't block rendering. Relative URLs: the app also runs under a subpath. -->

    <link rel="preload" href="fonts/SpaceGrotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
